services:
  - type: web
    name: scholaragent-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: EMBEDDING_MODEL
        value: text-embedding-004
      - key: SQLITE_PATH
        value: ./app/data/scholaragent.db
      - key: CHROMA_PATH
        value: ./app/data/chroma_store
      - key: CHROMA_COLLECTION
        value: scholaragent_papers
      - key: TAVILY_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app
      - key: EVAL_TOP_K
        value: "5"
    disk:
      name: scholaragent-data
      mountPath: /opt/render/project/src/backend/app/data
      sizeGB: 1
